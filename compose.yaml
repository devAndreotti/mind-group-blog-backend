services:
  mysql:
    image: mysql:8.4
    container_name: mind-group-blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mindgroup}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mind_group_blog}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mind-group-blog-mysql-data:/var/lib/mysql
      - ./dump.sql:/docker-entrypoint-initdb.d/01-dump.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mind-group-blog-mysql-data:
